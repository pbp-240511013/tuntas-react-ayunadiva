<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tuntas: catat tugas harianmu dan selesaikan satu per satu.">
  <title>Tuntas – Selesaikan satu per satu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
  <script>
    // Atur tema sebelum React tampil supaya layar tidak berkedip
    (function () {
      var simpan = null;
      try { simpan = localStorage.getItem("tuntas-react-tema"); } catch (e) {}
      var gelap = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", simpan || (gelap ? "dark" : "light"));
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
